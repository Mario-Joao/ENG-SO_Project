<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caderneta Digital - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login-container">
    <h1>Caderneta Digital</h1>
    <p class="subtitle">Gestão do Coordenador de Turno</p>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">E-mail institucional</label>
        <input type="email" id="email" name="email" placeholder="ex: coord.manha@escola.ao" required>
      </div>
      <div class="form-group">
        <label for="password">Palavra-passe</label>
        <input type="password" id="password" name="password" placeholder="Introduza a palavra-passe" required>
      </div>
      <p id="errorMsg" class="error-msg" role="alert" aria-live="polite"></p>
      <button type="submit">Entrar</button>
    </form>
    <div class="demo-creds">
      <small><strong>Contas fictícias de teste:</strong><br>
      Coordenador: <code>coord@escola.ao</code> / <code>1234</code><br>
      Direcção: <code>direccao@escola.ao</code> / <code>1234</code></small>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
